<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/leaf.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#244930" />
    <meta name="description" content="Certified grafted fruit varieties, robust rootstocks, and verified pedigree saplings for professional growers." />
    <link rel="manifest" href="/manifest.json" />

    <!-- Google Fonts: Playfair Display (Serif) & Inter (Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />

    <!-- Pre-paint Theme Script (Eliminates Flash) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('nurcery_theme');
          var isDark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <title>Deep Root Farms - Premium Horticulture & Plant Pedigree</title>
  </head>
  <body class="bg-earth-50 text-stone-800 dark:bg-stone-950 dark:text-stone-100 transition-colors duration-200 antialiased selection:bg-brand-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
